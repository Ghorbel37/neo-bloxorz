name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<package.json version>) with the APK
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: |
          mkdir -p screenshots
          SCREENSHOT_DIR=screenshots npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK after the version
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "neo-bloxorz-v$VERSION.apk"
          echo "file=neo-bloxorz-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: neo-bloxorz-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.apk.outputs.version }}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Neo Bloxorz v${{ steps.apk.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.file }}
